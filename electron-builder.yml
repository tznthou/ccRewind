appId: com.ccrewind.app
productName: ccRewind
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
extraResources:
  # License texts of the bundled fonts (SIL OFL 1.1), outside the asar so they can be read.
  # electron-builder only warns when this folder is missing, so electron-smoke runs
  # scripts/check-packaged-font-licenses.sh on the packaged app.
  - from: src/renderer/assets/fonts/licenses
    to: licenses/fonts
afterPack: ./scripts/afterPack.js
mac:
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
    - zip
  artifactName: ${name}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: true
asarUnpack:
  - node_modules/better-sqlite3
