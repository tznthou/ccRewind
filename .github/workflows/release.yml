name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # 說明文字從 CHANGELOG.md 抽當版段落組出來。這一步跑在 build 之前，
      # 所以 CHANGELOG 漏寫該版本時會在這裡就停下，不會先產出 artifacts 才發現。
      - name: Build release notes
        id: notes
        run: |
          ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "本版說明文字（${VERSION}）："
          cat "$RUNNER_TEMP/release-notes.md"
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Create Release
        run: |
          gh release delete "$VERSION" --yes || true
          gh release create "$VERSION" \
            --title "ccRewind $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'  # node 22 for better-sqlite3 prebuild (see electron-smoke.yml)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package (DMG + ZIP)
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts
        run: |
          echo "Release artifacts:"
          find dist -name "*.dmg" -o -name "*.zip" | grep -v blockmap | while read -r f; do
            echo "  $(basename "$f") ($(du -h "$f" | cut -f1))"
          done
          DMG_COUNT=$(find dist -name "*.dmg" | wc -l)
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found"
            exit 1
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'  # node 22 for better-sqlite3 prebuild (see electron-smoke.yml)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pnpm\store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package (NSIS + ZIP)
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts
        shell: bash
        run: |
          echo "Release artifacts:"
          find dist -name "*.exe" -o -name "*.zip" | grep -v blockmap | while read -r f; do
            echo "  $(basename "$f")"
          done
          EXE_COUNT=$(find dist -name "*.exe" | wc -l)
          if [ "$EXE_COUNT" -eq 0 ]; then
            echo "ERROR: No EXE files found"
            exit 1
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
