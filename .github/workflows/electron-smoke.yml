name: Electron Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # node 22: better-sqlite3 13 needs >= 22. Its prebuilds are N-API binaries shipped inside the
          # package, one per platform, loaded by Node and Electron alike. node-gyp still runs (pnpm install
          # for its binding.gyp, electron-rebuild in postinstall and dist), but builds nothing when a
          # prebuild exists. Net: zero native compilation.
          node-version: '22.23.4'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache pnpm store (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pnpm\store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Cache Electron (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for Electron
        run: pnpm exec electron-rebuild -f -o better-sqlite3

      - name: Run native binding smoke
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: pnpm exec electron scripts/electron-smoke.cjs

      - name: Build
        run: pnpm build

      # index.html loads theme-init.js and font-scale-init.js as classic scripts, which Vite only copies from the
      # public directory; the packaged app pointed at files it did not contain (theme-init.js from v0.5.0,
      # font-scale-init.js from v1.10.0). Checked again on the packaged app.asar below.
      - name: Check the built page's script and stylesheet references
        shell: bash
        run: node scripts/check-built-html-refs.mjs out/renderer

      - name: Package (electron-builder)
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load better-sqlite3 in the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          APP=$(find dist -maxdepth 2 -name 'ccRewind.app' -type d | head -n 1)
          [ -n "$APP" ] || { echo "ERROR: no ccRewind.app under dist/"; exit 1; }
          "$APP/Contents/MacOS/ccRewind" scripts/packaged-native-check.cjs

      - name: Load better-sqlite3 in the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: dist/win-unpacked/ccRewind.exe scripts/packaged-native-check.cjs

      # The same check on what electron-builder packed, read through the app's own asar support: lookups inside an
      # asar are case-sensitive while the runners' file systems are not, and only this sees the packaging rules
      - name: Check the packaged page's script and stylesheet references (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          APP=$(find dist -maxdepth 2 -name 'ccRewind.app' -type d | head -n 1)
          [ -n "$APP" ] || { echo "ERROR: no ccRewind.app under dist/"; exit 1; }
          "$APP/Contents/MacOS/ccRewind" scripts/check-built-html-refs.mjs "$APP/Contents/Resources/app.asar/out/renderer"

      - name: Check the packaged page's script and stylesheet references (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: dist/win-unpacked/ccRewind.exe scripts/check-built-html-refs.mjs dist/win-unpacked/resources/app.asar/out/renderer

      - name: Check the bundled fonts and their licenses
        shell: bash
        run: |
          node scripts/check-built-fonts.mjs out/renderer
          bash scripts/check-packaged-font-licenses.sh dist

      - name: Verify artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG_COUNT=$(find dist -name "*.dmg" 2>/dev/null | wc -l)
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files generated"
            exit 1
          fi
          echo "macOS artifacts:"
          find dist -name "*.dmg" -o -name "*.zip" | grep -v blockmap | while read -r f; do
            echo "  $(basename "$f")"
          done

      - name: Verify artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE_COUNT=$(find dist -name "*.exe" 2>/dev/null | wc -l)
          if [ "$EXE_COUNT" -eq 0 ]; then
            echo "ERROR: No EXE files generated"
            exit 1
          fi
          echo "Windows artifacts:"
          find dist -name "*.exe" -o -name "*.zip" | grep -v blockmap | while read -r f; do
            echo "  $(basename "$f")"
          done
