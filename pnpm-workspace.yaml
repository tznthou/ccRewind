allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  electron-winstaller: true
shamefullyHoist: true
# 3 days, the same as Renovate's minimumReleaseAge: the lockfile must not resolve an in-range version younger than that.
# Keep it strict: with minimumReleaseAgeStrict: false, which pnpm's error message offers, pnpm add and pnpm update
# exempt young versions by themselves. For one urgent release, list that version (e.g. eslint@10.13.0) under
# minimumReleaseAgeExclude and remove it after three days; a bare package name would exempt every later version.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: electron@42.11.16
  - electron@42.11.16
